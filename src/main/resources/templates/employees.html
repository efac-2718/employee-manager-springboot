<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Employee Manager</h1>

<p class="message" th:if="${message}" th:text="${message}"></p>

<h2>Add Employee</h2>
<form th:action="@{/employees}" th:object="${employee}" method="post">
    <div class="field">
        <label for="name">Full name</label>
        <input type="text" th:field="*{name}">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" th:field="*{email}">
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>
    <div class="field">
        <label for="phone">Phone</label>
        <input type="text" th:field="*{phone}">
        <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
    </div>
    <div class="field">
        <label for="department">Department</label>
        <input type="text" th:field="*{department}">
        <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
    </div>
    <div class="field">
        <label for="salary">Salary</label>
        <input type="number" step="0.01" th:field="*{salary}">
        <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
    </div>
    <button type="submit">Save Employee</button>
</form>

<h2>Employees (<span th:text="${employees.size()}">0</span>)</h2>
<table>
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Salary</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.name}"></td>
        <td th:text="${e.email}"></td>
        <td th:text="${e.phone}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${#numbers.formatDecimal(e.salary, 1, 'COMMA', 2, 'POINT')}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a>
            <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post"
                  onsubmit="return confirm('Delete this employee?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${employees.isEmpty()}">
        <td colspan="7">No employees yet.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
