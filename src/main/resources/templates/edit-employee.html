<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
    <div class="field">
        <label for="name">Full name</label>
        <input type="text" th:field="*{name}">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" th:field="*{email}">
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>
    <div class="field">
        <label for="phone">Phone</label>
        <input type="text" th:field="*{phone}">
        <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
    </div>
    <div class="field">
        <label for="department">Department</label>
        <input type="text" th:field="*{department}">
        <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
    </div>
    <div class="field">
        <label for="salary">Salary</label>
        <input type="number" step="0.01" th:field="*{salary}">
        <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
    </div>
    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>
</body>
</html>
